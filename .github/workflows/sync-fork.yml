# 定时把上游（huggingface/speech-to-speech）的新提交合并进本 fork。
#
# 本仓库只是留个自己的副本，不发布任何构建产物，因此同步后不触发其它工作流。
# 上游自带的 ci.yml / publish.yml 会跟随同步进来的代码一起更新。
#
# 合并冲突时本工作流会失败并保留现场（绝不 force push），此时需人工合并。

name: Sync fork

on:
  schedule:
    # 每天北京时间 03:47 = UTC 19:47，与另外两个 fork 的同步错开，避免抢占运行器。
    # 不取整点：GitHub schedule 在整点高峰排队严重，实测会被延迟甚至静默丢弃。
    - cron: '47 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本 fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游新提交
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huggingface/speech-to-speech.git
          git fetch upstream --prune --tags

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游无新提交，跳过"
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            echo "::error::与上游合并冲突，需人工处理（未做任何推送）"
            git merge --abort || true
            exit 1
          fi

          # 直接推；若被拒则回退重试。
          #
          # 为什么会被拒：上游一旦改动 .github/workflows/*（如 publish.yml），
          # 而本工作流用的是仓库自带 GITHUB_TOKEN（GitHub App 身份），
          # GitHub 会拒绝它创建/更新 workflow 文件：
          #   refusing to allow a GitHub App to create or update workflow ... without `workflows` permission
          # 实测 2026-09-28 ~ 09-30 连续三天：合并成功但 push 被拒 → 整条同步失败，
          # 上游新提交一直没进来（下次上游改 workflow 时仍会复发）。
          # 处理：保留 fork 自身的工作流文件后重试（代码照常同步，只是不跟进上游的 CI 改动）。
          # 想连工作流也一起跟进，就给仓库加一个有 workflow scope 的 PAT 存成 secret
          # （如 SYNC_PAT），把下面 push 的凭据换成它即可。
          if git push origin HEAD:main; then
            echo "同步完成（含上游工作流改动）"
          else
            echo "::warning::push 被拒（GITHUB_TOKEN 无 workflows 权限，通常因上游改了 .github/workflows/*）"
            echo "::warning::改为保留 fork 自身工作流后重试"
            git checkout HEAD^1 -- .github/workflows/ || true
            git commit -m "ci: 同步时保留 fork 自身工作流（GITHUB_TOKEN 无 workflows 权限）" || true
            git push origin HEAD:main
            echo "同步完成（已保留 fork 自身工作流）"
          fi
